[package]
name = "lexi"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
html5ever = "0.35"
markup5ever_rcdom = "0.35"
# System libsqlite3 via pkg-config. Do not enable the `bundled` feature.
rusqlite = "0.37"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
terminal_size = "0.4"
textwrap = "0.16"

[dev-dependencies]
rustix = { version = "1.1", features = ["pty", "termios"] }
tempfile = "3.20"
